<head>

  <meta name="theme-color" content="#070b16">
  <link rel="canonical" href="https://i2003-byte.github.io/mathematics/">

  <!-- Social previews (Open Graph / Twitter) -->

  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
  <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('simlab-theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.dataset.theme=t})();</script>

<!--
  SUBJECT PAGE TEMPLATE — identical for every subject.
  To add a subject: copy this file to /<subject-id>/index.html, change
  data-subject below (and the <title>/description), then add the subject
  to /assets/js/catalog.js. Everything else is rendered by subject.js.
-->
<body data-page="subjects" data-subject="mathematics">

  <main id="main">
    <div class="container" id="subject-root"></div>
  </main>

  <script src="/assets/js/catalog.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/subject.js"></script>
