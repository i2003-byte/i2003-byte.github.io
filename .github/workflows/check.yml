# Runs the SimLab site check on every push and pull request.
# A red ✗ on a commit means something is broken — see the log for the exact problem.
name: Site check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate catalog, links, pages and generated files
        run: node tools/check.mjs
