<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="balancing-equations">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#831843"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <text x="160" y="40" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2H₂ + O₂ → 2H₂O</text>
  <g stroke="#000" stroke-opacity=".5">
    <circle cx="40" cy="95" r="11" fill="#f8fafc"/><circle cx="56" cy="95" r="11" fill="#f8fafc"/>
    <circle cx="40" cy="130" r="11" fill="#f8fafc"/><circle cx="56" cy="130" r="11" fill="#f8fafc"/>
    <circle cx="108" cy="112" r="13" fill="#ef4444"/><circle cx="128" cy="112" r="13" fill="#ef4444"/>
    <circle cx="210" cy="92" r="8" fill="#f8fafc"/><circle cx="240" cy="92" r="8" fill="#f8fafc"/><circle cx="225" cy="84" r="13" fill="#ef4444"/>
    <circle cx="210" cy="140" r="8" fill="#f8fafc"/><circle cx="240" cy="140" r="8" fill="#f8fafc"/><circle cx="225" cy="132" r="13" fill="#ef4444"/>
  </g>
  <path d="M150 112H182" stroke="#fff" stroke-width="3"/><path d="M186 112l-10-6v12z" fill="#fff"/>
  <text x="82" y="118" font-family="sans-serif" font-size="22" font-weight="700" fill="#cbd5e1" text-anchor="middle">+</text>
  <rect x="60" y="160" width="200" height="28" rx="8" fill="#16a34a" fill-opacity=".85"/>
  <text x="160" y="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">H 4 = 4   O 2 = 2  ✓</text>
</svg>
