<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="distance-time graph">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1e2e"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect x="40" y="20" width="260" height="150" fill="url(#grid)"/>
  <line x1="40" y1="170" x2="300" y2="170" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="40" y1="20" x2="40" y2="170" stroke="#cbd5e1" stroke-width="2"/>
  <polyline points="40,170 105,130 170,70 235,70 300,30" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
  <line x1="170" y1="70" x2="235" y2="70" stroke="#fbbf24" stroke-width="4"/>
  <g fill="#f8fafc"><circle cx="40" cy="170" r="4"/><circle cx="105" cy="130" r="4"/><circle cx="170" cy="70" r="4"/><circle cx="235" cy="70" r="4"/><circle cx="300" cy="30" r="4"/></g>
  <rect x="190" y="40" width="30" height="16" rx="4" fill="#f472b6"/><circle cx="197" cy="57" r="3.5" fill="#f8fafc"/><circle cx="213" cy="57" r="3.5" fill="#f8fafc"/>
  <text x="170" y="192" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">time</text>
  <text x="14" y="95" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle" transform="rotate(-90 14 95)">distance</text>
</svg>
