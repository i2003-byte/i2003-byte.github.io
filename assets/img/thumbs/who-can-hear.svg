<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="who-can-hear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14532d"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <rect x="20" y="150" width="280" height="10" rx="5" fill="#34d399" fill-opacity=".35"/><line x1="200" y1="20" x2="200" y2="170" stroke="#fbbf24" stroke-width="3"/>
  <text x="70" y="60" font-size="44" text-anchor="middle" dominant-baseline="central">🦇</text>  <text x="160" y="60" font-size="44" text-anchor="middle" dominant-baseline="central">🐕</text>  <text x="250" y="60" font-size="44" text-anchor="middle" dominant-baseline="central">🐘</text>  <text x="120" y="120" font-size="38" text-anchor="middle" dominant-baseline="central">🧒</text>
</svg>
